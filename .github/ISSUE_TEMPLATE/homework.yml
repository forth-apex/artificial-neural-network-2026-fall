name: "作业提交 / Homework submission"
description: "Artificial Neural Network · Fall 2026：填写信息并上传 ZIP 作业，无需管理员邀请或审核。"
title: "学号_姓名全拼"
body:
  - type: markdown
    attributes:
      value: |
        ## ZIP 提交要求
        **命名：学号_姓名全拼.zip，例如 2026000001_zhangsan.zip。** 姓名使用中文姓名拼音，姓在前、名在后连写，不在姓与名之间加下划线或空格。示例学号请替换为自己的。
        ZIP 根目录必须直接包含两个文件夹：`SANDBOX` 放沙箱程序，`BIGMODEL` 放大模型程序；两个文件夹名均为大写英文，不含空格。
        使用自己的 GitHub 账号，本课程只收一次作业，每人只发一张 Issue；更正在原 Issue 评论区上传新版，ZIP 命名仍保持不变。
        只提交自己的程序源代码、必要的小型配置和依赖清单；ZIP 不得超过 20 MB。不提交模型权重、数据集、完整环境、缓存、日志、图片、视频或输出结果，不接受网盘链接代交。
        **两个文件夹中必须各有一份环境配置 README.md：`SANDBOX/README.md` 和 `BIGMODEL/README.md`。** 分别写清环境版本、依赖安装、配置与运行步骤。
        请建立干净的提交副本，只复制需要的代码、配置和说明，再选中两个文件夹生成 ZIP。将 ZIP 拖入下方附件框，等待出现附件链接后再发布。
        [更详细的注册、避免大文件、打包及上传步骤，请见仓库 README。](https://github.com/forth-apex/artificial-neural-network-2026-fall#readme)
        **本仓库公开，文件名中的学号和姓名拼音以及作业附件会公开可见。** 除课程要求信息外不要提交额外个人资料、密码或 API 密钥。
        附件先保存在 Issues，管理员之后在需要时另行整理到 main 分支，不自动汇总。
  - type: input
    id: student
    attributes:
      label: GitHub 用户名
      description: 填写你当前登录的 GitHub 用户名。ZIP 文件名必须按要求包含学号和姓名全拼。
      placeholder: "例如 student-demo"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本号
      value: "v1"
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 作业 ZIP 压缩包
      description: 上传一个不超过 20 MB 的 ZIP，只含程序、必要的小型配置与依赖清单，以及两个文件夹各自的环境配置 README.md。超出时先清理再打包，不接受网盘链接代交。
      placeholder: "在这里拖入 学号_姓名全拼.zip，例如 2026000001_zhangsan.zip。等待上传完成，并保留自动生成的附件链接。"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明（选填）
      description: 可写补充备注。环境配置与运行步骤必须分别写在 ZIP 内的 SANDBOX/README.md 和 BIGMODEL/README.md，不能只填在此处。
      placeholder: "如有补充事项请填写；两份环境配置 README.md 仍须放在对应程序文件夹内。"
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      description: 表单不会自动检查 ZIP 大小、文件名、目录、README 或截止时间，请自行核对。
      options:
        - label: "ZIP 不超过 20 MB，只含自己的源代码、必要的小型配置、依赖清单和说明，不含权重、数据集、环境、缓存或输出等大文件，也未用网盘链接代交。"
          required: true
        - label: "ZIP 已按要求命名并包含 SANDBOX 和 BIGMODEL，两个文件夹各有对应程序和独立的环境配置 README.md。"
          required: true
        - label: "我已按学号_姓名全拼填写标题，并确认 ZIP 附件上传完成、能够下载。"
          required: true
        - label: "我已知晓学号与姓名拼音将公开，并检查作业不含额外个人资料、密码、API 密钥或未经授权的数据。"
          required: true
